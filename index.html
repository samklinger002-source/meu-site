<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Sorte</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      color:white;
    }

    .container{
      background:#1e1e1e;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:350px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
      margin-bottom:20px;
    }

    p{
      margin-bottom:20px;
      color:#ccc;
    }

    button{
      padding:15px 30px;
      border:none;
      border-radius:10px;
      background:#00b894;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    #resultado{
      margin-top:25px;
      font-size:24px;
      font-weight:bold;
    }

    .ganhou{
      color:#00ff88;
    }

    .perdeu{
      color:#ff4d4d;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>🎰 Jogo da Sorte</h1>

    <p>Clique no botão e teste sua sorte.</p>

    <button onclick="jogar()">
      Jogar
    </button>

    <div id="resultado"></div>

  </div>

  <script>

    function jogar(){

      // número aleatório de 1 até 3
      let numero = Math.floor(Math.random() * 3) + 1;

      let resultado = document.getElementById("resultado");

      // chance de 1/3 de ganhar
      if(numero === 1){

        resultado.innerHTML = "🇧🇷 Bolsonaro livre 🇧🇷";
        resultado.className = "ganhou";

      }else{

        resultado.innerHTML = "💀 🚩 PETISTA 🚩";
        resultado.className = "perdeu";

      }

    }

  </script>

</body>
</html>
